name: iOS Release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 9.0.100
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.100

      - name: Clean .NET 10
        run: |
          rm -rf /Users/runner/.dotnet/sdk/10.*
          rm -rf /Users/runner/.dotnet/sdk-manifests/10.*
          rm -rf /Users/runner/.dotnet/packs/*26.5*

      - name: Install MAUI 9.0.100
        run: dotnet workload install maui --version 9.0.100

      - name: List files
        run: |
          pwd
          ls -la
          echo "--- all projects ---"
          find . -type f -name "*.csproj" -o -name "*.slnx" -o -name "*.sln"

      - name: Restore
        run: |
          FILE=$(find . -name "*.slnx" -o -name "*.sln" -o -name "*.csproj" | head -1)
          echo "Restoring: $FILE"
          dotnet restore "$FILE" -p:EnableWindowsTargeting=true -p:CheckEolWorkloads=false

      - name: Build iOS IPA
        run: |
          CSPROJ=$(find . -name "FlexiPortal.Mobile.csproj" -o -name "*.Mobile.csproj" | head -1)
          echo "Publishing: $CSPROJ"
          dotnet publish "$CSPROJ" -f net9.0-ios -c Release -r ios-arm64 -p:BuildIpa=true -p:EnableCodeSigning=false -p:EnableWindowsTargeting=true -p:CheckEolWorkloads=false -p:RunAOTCompilation=false -p:PlatformTarget=AnyCPU

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: "**/*.ipa"

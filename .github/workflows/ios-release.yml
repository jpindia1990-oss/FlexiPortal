name: iOS Release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 9.0.100
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.100

      - name: Clean .NET 10 and 26.5 packs
        run: |
          rm -rf /Users/runner/.dotnet/sdk/10.*
          rm -rf /Users/runner/.dotnet/sdk-manifests/10.*
          rm -rf /Users/runner/.dotnet/packs/Microsoft.iOS.Sdk.net9.0_26.5
          rm -rf /Users/runner/.dotnet/packs/Microsoft.iOS.Sdk.net9.0_18.0*
          ls /Users/runner/.dotnet/packs/ | grep iOS || echo "no ios pack"
          dotnet --version

      - name: Install MAUI 9.0.100 stable
        run: dotnet workload install maui --version 9.0.100

      - name: Verify no 26.5
        run: |
          ls /Users/runner/.dotnet/packs/ | grep iOS
          cat /Users/runner/.dotnet/packs/Microsoft.iOS.Sdk.net9.0_*/Sdk/AutoImport.props | grep Xcode || true

      - name: Restore
        run: dotnet restore FlexiPortal.Mobile.csproj -p:EnableWindowsTargeting=true -p:CheckEolWorkloads=false

      - name: Build iOS IPA
        run: dotnet publish FlexiPortal.Mobile.csproj -f net9.0-ios -c Release -p:BuildIpa=true -p:EnableCodeSigning=false -p:EnableWindowsTargeting=true -p:CheckEolWorkloads=false -p:RunAOTCompilation=false

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: "**/*.ipa"